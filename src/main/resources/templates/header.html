<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo - header</title>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>

<!--Comment Service [로그인버튼][로그아웃버튼]-->
<!--        로그아웃버튼은 당연히 로그인 했을때만 보이게 함-->
<!--example이랑 docs의 button 섞어 사용한 예제 -->
<div class="container" th:fragment="header">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"/></svg>
            <span class="fs-4">Comment Service</span>
        </a>

        <ul class="nav nav-pills">
<!--            사실 여기 a태그로 하는게 좋긴한데... 버튼을 가져오다보니;-->
<!--            location.href vs a href https://okky.kr/questions/304141   후자를 쓰는게 일반적으로 좋을거같긴한데... 음 -->
            <li class="nav-item">
                <button sec:authorize="!isAuthenticated()" type="button" class="btn btn-primary" style="margin-right: 7px"
                                         onclick="location.href='/login'">로그인</button>
                <span sec:authorize="isAuthenticated()" th:text="${#authentication.getName()}+'님'" style="margin-right: 10px; display: flex"/>
            </li>
            <li class="nav-item">
                <button type="button" class="btn btn-primary" onclick="location.href='/logout'">로그아웃</button>
            </li>
        </ul>
    </header>
</div>
